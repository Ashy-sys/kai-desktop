[package]
name = "kai-desktop"
version = "0.1.0"
description = "A lightweight Windows desktop companion"
authors = ["Kai Desktop"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
walkdir = "2"
sysinfo = "0.37"
